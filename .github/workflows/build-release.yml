name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            c_compiler: gcc
            asset_name: linux-x64
          - os: ubuntu-24.04-arm
            c_compiler: gcc
            asset_name: linux-arm64
          - os: macos-latest
            c_compiler: clang
            asset_name: macos-arm64
          - os: macos-14
            c_compiler: clang
            asset_name: macos-x64
          - os: windows-latest
            c_compiler: cl
            asset_name: windows-x64

    steps:
    - uses: actions/checkout@v4

      # this step will be needed until a previous version of cute can be used
      # to compile the package
    - name: Bootstrap dependencies
      shell: bash
      run: |
        mkdir -p .libraries/Matt-DESTROYER_file-io
        git clone https://github.com/Matt-DESTROYER/file-io.git .libraries/Matt-DESTROYER_file-io

    - name: Configure CMake
      shell: bash
      env:
        CC: ${{ matrix.c_compiler }}
      run: |
        if [ "${{ runner.os }}" == "Windows" ]; then
          cmake -S "${{ github.workspace }}" -B "${{ github.workspace }}/build" -DCMAKE_BUILD_TYPE=Release # -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
        else
          cmake -S "${{ github.workspace }}" -B "${{ github.workspace }}/build" -DCMAKE_BUILD_TYPE=Release
        fi

    - name: Build
      shell: bash
      run: cmake --build "${{ github.workspace }}/build" --config Release

    - name: Prepare artifact directory
      shell: bash
      run: |
        mkdir -p artifact
        if [ -f "${{ github.workspace }}/build/Release/cute.exe" ]; then
          cp "${{ github.workspace }}/build/Release/cute.exe" artifact/cute.exe
        elif [ -f "${{ github.workspace }}/build/cute" ]; then
          cp "${{ github.workspace }}/build/cute" artifact/cute
        else
          echo "Error: Executable not found!"
          exit 1
        fi

    - name: Ensure version matches tag
      shell: bash
      run: |
        CUTE="artifact/cute"
        if [ -f "artifact/cute.exe" ]; then
          CUTE="artifact/cute.exe"
        fi

        chmod +x "$CUTE"

        version=$("$CUTE" version | tr -d '\r')

        if [[ "$version" != "${{ github.ref_name }}" ]]; then
          echo "Error: binary version ($version) doesn't match tag version (${{ github.ref_name }})"
          exit 1
        fi

        echo "Version check passed!"

    - name: Attest build provenance
      uses: actions/attest-build-provenance@v3
      with:
        subject-path: "artifact/*"

    - name: Create release archive
      shell: bash
      run: |
        cd artifact
        if [ "${{ matrix.os }}" == "windows-latest" ]; then
          7z a ../cute-${{ matrix.asset_name }}.zip *
        else
          tar -czf ../cute-${{ matrix.asset_name }}.tar.gz *
        fi

    - name: Upload artifact to release
      uses: softprops/action-gh-release@v2
      with:
        files: cute-${{ matrix.asset_name }}.*
        generate_release_notes: true
