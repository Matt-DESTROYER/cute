name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            c_compiler: gcc
            asset_name: linux-x64
          - os: ubuntu-24.04-arm
            c_compiler: gcc
            asset_name: linux-arm64
          - os: macos-latest
            c_compiler: clang
            asset_name: macos-arm64
          - os: macos-14
            c_compiler: clang
            asset_name: macos-x64
          - os: windows-latest
            c_compiler: cl
            asset_name: windows-x64

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download previous Cute release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        PREVIOUS_TAG=$(gh release list \
          --limit 2 \
          --exclude-drafts \
          --exclude-pre-releases \
          --json tagName \
          --jq '.[1].tagName' \
        )

        if [ "${{ matrix.os }}" == "windows-latest" ]; then
          gh release download "$PREVIOUS_TAG" \
            --pattern "cute-${{ matrix.asset_name }}.zip" \
            --dir previous-release
          unzip -qo "previous-release/cute-${{ matrix.asset_name }}.zip" -d previous-release/
        else
          gh release download "$PREVIOUS_TAG" \
            --pattern "cute-${{ matrix.asset_name }}.tar.gz" \
            --dir previous-release
          tar -xf "previous-release/cute-${{ matrix.asset_name }}.tar.gz" -C previous-release/
        fi

    - name: Build
      shell: bash
      run: ./previous-release/cute build --release

    - name: Prepare artifact directory
      shell: bash
      run: |
        mkdir -p artifact
        if [ -f "${{ github.workspace }}/build/Release/cute.exe" ]; then
          cp "${{ github.workspace }}/build/Release/cute.exe" artifact/cute.exe
        elif [ -f "${{ github.workspace }}/build/cute" ]; then
          cp "${{ github.workspace }}/build/cute" artifact/cute
        else
          echo "Error: Executable not found!"
          exit 1
        fi

    - name: Ensure version matches tag
      shell: bash
      run: |
        CUTE="artifact/cute"
        if [ -f "artifact/cute.exe" ]; then
          CUTE="artifact/cute.exe"
        fi

        chmod +x "$CUTE"

        version=$("$CUTE" version | tr -d '\r')

        if [[ "$version" != "${{ github.ref_name }}" ]]; then
          echo "Error: binary version ($version) doesn't match tag version (${{ github.ref_name }})"
          exit 1
        fi

        echo "Version check passed!"

    - name: Attest build provenance
      uses: actions/attest-build-provenance@v3
      with:
        subject-path: "artifact/*"

    - name: Create release archive
      shell: bash
      run: |
        cd artifact
        if [ "${{ matrix.os }}" == "windows-latest" ]; then
          7z a ../cute-${{ matrix.asset_name }}.zip *
        else
          tar -czf ../cute-${{ matrix.asset_name }}.tar.gz *
        fi

    - name: Upload artifact to release
      uses: softprops/action-gh-release@v2
      with:
        files: cute-${{ matrix.asset_name }}.*
        generate_release_notes: true
